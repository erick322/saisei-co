<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E3B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../img/gestion-180.png">
<link rel="icon" href="../img/gestion-192.png">
<title>Saisei & Co · Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --pine:#0E3B2E; --pine-d:#062419; --pine-2:#174d3c; --rice:#F4F6EE; --rice2:#E8EDE1; --card:#fff; --line:#dde5d6;
         --ink:#13261F; --ink2:#55695f; --salmon:#EE7A4F; --mango:#F3C552; --ok:#2c8a57; --ok-bg:#e3f3e8; --bad:#c2453a; --bad-bg:#fbe7e4;
         --warn:#a8700a; --warn-bg:#fdf1d6; --info-bg:#e6eef7; --info:#2d5d8a; --r:16px; --sh:0 1px 2px rgba(19,38,31,.06),0 4px 14px rgba(19,38,31,.05); }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--rice);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
  h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;letter-spacing:.3px;margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--pine)}
  [hidden]{display:none!important}
  .ico{width:20px;height:20px;flex:none}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- Estructura ---------- */
  .app{min-height:100vh}
  .side{display:none}
  .main{min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .top{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top h1{font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .month{display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:999px}
  .month button{background:none;border:0;color:#fff;padding:7px 10px;cursor:pointer;border-radius:999px;display:grid;place-items:center}
  .month button:hover{background:rgba(255,255,255,.12)}
  .month .lbl{font-weight:600;font-size:14px;min-width:118px;text-align:center;padding:7px 4px}
  .sync{display:flex;align-items:center;gap:6px;font-size:12px;color:#cfe0d6;white-space:nowrap}
  .sync i{width:8px;height:8px;border-radius:50%;background:#7fd3a2;display:inline-block}
  .sync.busy i{background:var(--mango);animation:pulse 1s infinite}
  .sync.off i{background:#ff9c8f}
  .sync.local i{background:#c9d4ce}
  @keyframes pulse{50%{opacity:.3}}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  .banner{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:#5e430a;font-size:14px;display:flex;gap:10px;align-items:flex-start}
  .banner.info{background:var(--info-bg);color:#1f3f5e}
  .banner b{font-weight:700}
  .banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px}

  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--ink2);text-decoration:none;border-radius:10px}
  .tabs a.on{color:var(--pine)}
  .tabs a.on .ico{background:var(--rice2);border-radius:10px;padding:2px 10px;width:44px;height:26px}
  .tabs a{position:relative}
  .nb{background:var(--salmon);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:19px;height:19px;padding:0 5px;display:inline-grid;place-items:center;margin-left:auto;line-height:1}
  .tabs .nb{position:absolute;top:1px;left:calc(50% + 6px);margin:0}
  .fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:18px;border:0;background:var(--salmon);color:#fff;box-shadow:0 6px 18px rgba(238,122,79,.45);display:grid;place-items:center;cursor:pointer}
  .fab .ico{width:28px;height:28px}

  @media (min-width:900px){
    .app{display:grid;grid-template-columns:236px 1fr}
    .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--pine-d);color:#dfe9e3;padding:18px 12px;overflow:auto}
    .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
    .brand .lg{width:38px;height:38px;border-radius:50%;background:var(--rice);color:var(--pine);border:2px solid var(--mango);display:grid;place-items:center;font-family:Marcellus,serif;font-size:19px}
    .brand b{font-family:Marcellus,serif;font-weight:400;font-size:18px;color:#fff;display:block;line-height:1.1}
    .brand small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mango)}
    .side .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f9b8e;margin:14px 10px 4px}
    .side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#dfe9e3;text-decoration:none;font-weight:500;font-size:14.5px}
    .side a:hover{background:rgba(255,255,255,.06)}
    .side a.on{background:var(--pine-2);color:#fff}
    .side .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#9db3a8;display:grid;gap:8px}
    .side .foot button{background:none;border:1px solid rgba(255,255,255,.15);color:#dfe9e3;border-radius:9px;padding:7px 10px;cursor:pointer;text-align:left}
    .main{padding-bottom:30px}
    .tabs{display:none}
    .fab{bottom:28px;right:28px}
    .top{padding:14px 24px}
    .wrap{padding:22px 24px}
  }

  /* ---------- Piezas ---------- */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr}
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  @media (min-width:700px){ .g2{grid-template-columns:1fr 1fr} .kpis{grid-template-columns:repeat(4,1fr)} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
  .card h2{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
  .card h2 .r{font-family:Figtree,sans-serif;font-size:13px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);min-width:0}
  .kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600}
  .kpi .v{font-size:23px;font-weight:800;margin-top:2px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
  .kpi.hero{background:var(--pine);color:#fff;border-color:var(--pine)}
  .kpi.hero .l,.kpi.hero .s{color:#bcd3c7}
  .pos{color:var(--ok)} .neg{color:var(--bad)}
  .kpi.hero .pos{color:#8fe3b2} .kpi.hero .neg{color:#ffb1a6}
  .muted{color:var(--ink2)} .small{font-size:13px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sp{flex:1}
  .mt{margin-top:14px}
  .hint{font-size:13px;color:var(--ink2);margin:4px 0 0}

  .b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:42px}
  .b:hover{border-color:#bccab5}
  .b.pri{background:var(--pine);border-color:var(--pine);color:#fff}
  .b.acc{background:var(--salmon);border-color:var(--salmon);color:#fff}
  .b.del{color:var(--bad);border-color:#efc9c3}
  .b.sm{padding:6px 11px;min-height:34px;font-size:13.5px;border-radius:9px}
  .b.ghost{background:transparent;border-color:transparent}
  .b:disabled{opacity:.5;cursor:default}
  .ib{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--ink2);display:inline-grid;place-items:center}
  .ib:hover{background:var(--rice2);color:var(--ink)}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--rice2);color:var(--ink2)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--info-bg);color:var(--info)}

  .bar{height:10px;background:var(--rice2);border-radius:999px;overflow:hidden;position:relative}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
  .bar.warn i{background:var(--mango)} .bar.bad i{background:var(--bad)}
  .bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  .prog .t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}
  .prog + .prog{margin-top:16px}

  /* Tablas */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:700;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 8px;border-bottom:1px solid #eef2ea;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.click{cursor:pointer} tr.click:hover td{background:#f8faf5}
  tr.tot td{font-weight:800;border-top:2px solid var(--line)}
  tr.sub td{font-weight:700;background:#f7f9f4}
  .t-res td:first-child{white-space:nowrap}
  .t-res td:first-child,.t-res th:first-child{position:sticky;left:-16px;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line)}
  .t-res tr.sub td:first-child{background:#f7f9f4}

  /* Listas */
  .list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
  .item:hover{border-color:#c4d2bd}
  .item .main-t{flex:1;min-width:0}
  .item .tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .st{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .am{text-align:right;font-weight:800;white-space:nowrap}
  .item .am small{display:block;font-weight:600;font-size:12px}
  .day{font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 2px 2px;display:flex;justify-content:space-between}
  .day span:first-child::first-letter{text-transform:uppercase}
  .empty{text-align:center;padding:34px 16px;color:var(--ink2)}
  .empty .ico{width:42px;height:42px;color:#a9bbb0;margin-bottom:6px}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);display:grid;gap:6px;box-shadow:var(--sh)}
  .tile .ico{width:26px;height:26px;color:var(--pine)}
  .tile b{font-size:15px} .tile span{font-size:12.5px;color:var(--ink2)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer}
  .chip.on{background:var(--pine);border-color:var(--pine);color:#fff}
  .search{position:relative;flex:1;min-width:180px}
  .search input{padding-left:36px}
  .search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink2);width:18px}

  /* Gráfico de barras */
  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
  .chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
  .chart .c i{display:block;width:100%;max-width:26px;background:var(--salmon);border-radius:4px 4px 0 0;min-height:1px}
  .chart .c i.z{background:var(--rice2)}
  .chart .c i.n{background:var(--bad);border-radius:0 0 4px 4px}
  .chart .c span{font-size:10px;color:var(--ink2);margin-top:4px;white-space:nowrap}
  .chart2{display:grid;gap:3px;height:170px}
  .ch2{display:flex;gap:6px;height:100%}
  .ch2 .c{flex:1;display:grid;grid-template-rows:1fr 1fr;min-width:0}
  .ch2 .up{display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #cfd9c9}
  .ch2 .dn{display:flex;align-items:flex-start;justify-content:center}
  .ch2 i{display:block;width:70%;max-width:30px;border-radius:4px 4px 0 0;background:var(--ok)}
  .ch2 .dn i{background:var(--bad);border-radius:0 0 4px 4px}
  .ch2l{display:flex;gap:6px}.ch2l span{flex:1;text-align:center;font-size:10.5px;color:var(--ink2);text-transform:capitalize}

  .alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--rice);text-decoration:none;color:var(--ink);font-size:14px}
  .alert + .alert{margin-top:8px}
  .alert .ico{color:var(--warn)} .alert.ok .ico{color:var(--ok)} .alert.bad .ico{color:var(--bad)}
  .alert b{font-weight:800}

  /* ---------- Formularios y modales ---------- */
  label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid #cfd9c9;background:#fff;min-height:42px}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(14,59,46,.25);border-color:var(--pine)}
  textarea{min-height:64px;resize:vertical}
  input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--pine)}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
  .unit{position:relative}.unit input{padding-right:44px}.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ink2);font-size:13px;pointer-events:none}
  .unit.pre input{padding-left:26px;padding-right:12px}.unit.pre em{left:12px;right:auto}
  .tin{min-height:36px;padding:6px 8px;border-radius:9px;text-align:right;max-width:120px}

  .overlay{position:fixed;inset:0;z-index:50;background:rgba(6,36,25,.45);display:flex;align-items:flex-end;justify-content:center}
  .overlay.ask{z-index:70;align-items:center;padding:16px}.overlay.ask .modal{max-width:420px;border-radius:18px}
  .modal{background:var(--rice);width:100%;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}}
  .modal.full{height:100%;max-height:100%;border-radius:0}
  .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;padding-top:max(14px,env(safe-area-inset-top))}
  .modal:not(.full) .mh{padding-top:14px}
  .mh h2{font-size:20px;flex:1}
  .mb{padding:4px 16px 18px;overflow:auto;flex:1}
  .mf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  @media (min-width:760px){
    .overlay{align-items:center;padding:24px}
    .modal{max-width:640px;border-radius:22px;max-height:90vh}
    .modal.wide{max-width:900px}
    .modal.full{height:auto;max-height:92vh;max-width:980px;border-radius:22px}
    .mh{padding-top:14px}
  }
  .sec{margin-top:16px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
  .pbtn{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 11px;text-align:left;cursor:pointer;min-height:62px}
  .pbtn:hover{border-color:var(--pine)}
  .pbtn b{display:block;font-size:13.5px;line-height:1.2}
  .pbtn span{font-size:12.5px;color:var(--ink2)}
  .pbtn .q{position:absolute;top:-7px;right:-7px;background:var(--salmon);color:#fff;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12.5px;font-weight:800;padding:0 6px}
  .pbtn.on{border-color:var(--salmon);background:#fff7f3}
  .lines{display:grid;gap:8px;margin-top:8px}
  .line{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px}
  .line .lt{display:flex;align-items:center;gap:8px}
  .line .lt b{flex:1;min-width:0}
  .line .lc{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:end;margin-top:8px}
  .line .lc label{margin:0 0 3px;font-size:11.5px}
  .step{display:flex;align-items:center;border:1px solid #cfd9c9;border-radius:11px;overflow:hidden;height:42px;background:#fff}
  .step button{border:0;background:var(--rice2);width:38px;height:100%;cursor:pointer;font-size:18px;font-weight:700}
  .step input{border:0;width:46px;text-align:center;min-height:0;height:100%;padding:0;border-radius:0}
  .tot{font-size:13px;color:var(--ink2)} .tot b{display:block;font-size:22px;color:var(--ink)}
  .ed-row{display:grid;grid-template-columns:1fr 90px 92px 34px;gap:8px;align-items:center;margin-top:8px}
  .ed-row input,.ed-row select{min-height:38px;padding:7px 9px}
  .ed-row .c{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
  .ed-h{display:grid;grid-template-columns:1fr 90px 92px 34px;gap:8px;font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-top:12px}
  .calc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:600px){.calc{grid-template-columns:repeat(4,1fr)}}
  .calc div{font-size:12px;color:var(--ink2);font-weight:600}.calc b{display:block;font-size:17px;color:var(--ink)}
  .formula{background:var(--info-bg);color:#1f3f5e;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}

  @media (max-width:640px){ .hide-sm{display:none} .top .sync span{display:none} .top .sync{padding:6px} }
  .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--bad)}
  @media (min-width:900px){.toast{bottom:40px}}

  .login{max-width:400px;margin:0 auto;padding:60px 16px}
  .login .card{padding:24px}
  .login h1{font-size:26px;margin-bottom:4px}
  .msg{font-size:14px;margin-top:10px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
  .boot{min-height:100vh;display:grid;place-items:center;color:var(--ink2)}
  .linkbtn{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer;font-size:14px}
  /* Conmutador Gestión | Cuentas (compartido con gestion/). Adaptable por currentColor */
  .appsw{display:inline-flex;gap:3px;padding:3px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 22%,transparent);font:600 13px/1 Figtree,sans-serif}
  .appsw>*{padding:6px 14px;border-radius:999px;text-decoration:none;color:inherit;opacity:.62;white-space:nowrap}
  .appsw>a:hover{opacity:.9}
  .appsw>[aria-current=page]{background:color-mix(in srgb,currentColor 16%,transparent);opacity:1}

const ico = (k, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[k] || ""}</svg>`;

// Listas de opciones (las mismas de la planilla)
const CANALES = ["WhatsApp", "Instagram", "Sitio web", "Presencial", "Otro"];
const PAGOS_V = ["Efectivo", "Transferencia", "Tarjeta / link de pago"];
const TIPOS_G = ["Insumos", "Empaques", "Costo fijo", "Equipamiento", "Otro"];
const PAGOS_G = ["Efectivo", "Transferencia", "Tarjeta de débito", "Tarjeta de crédito", "Crédito proveedor"];
// Movimientos con los dueños: no son ventas ni gastos (no cambian la utilidad), pero sí el dinero del mes
const TIPOS_D = { prestamo:"Préstamo al negocio", devolucion:"Devolución del préstamo", pago:"Pago al dueño",
  prestamo_local:"Préstamo del local al dueño", abono:"El dueño devuelve al local" };
const ENTRA_D = ["prestamo", "abono"];   // estos entran a la caja del local; el resto sale
const MEDIOS_D = ["Transferencia", "Efectivo"];
const UNIDADES = ["g", "ml", "un"];

// =====================================================================
//  Datos: en la nube (Supabase, tabla "cuentas") o en este dispositivo
// =====================================================================
const COLS = ["ventas", "gastos", "insumos", "recetas", "carta", "proveedores", "fijos", "saldos", "reservas", "apartados", "duenos"];
const PAR_DEF = { flete:.1, foodCost:.33, comision:.035, iva:.19, afectaIva:false, dias:20, ticket:15000, meta:500000, deliveryCobro:2000, deliveryCosto:1500, diaCorte:16 };
const LS_DATA = "saisei.cuentas.datos", LS_OUT = "saisei.cuentas.pendientes", LS_ROL = "saisei.cuentas.rol";
let S = blank();
let mode = "local";        // "nube" | "local"
let sb = null, user = null;
// "administrador" ve todo; "colaborador" solo el día a día (supabase/usuarios.sql). Sin nube, el dueño del dispositivo es administrador.
let rol = "administrador";
const esAdmin = () => rol === "administrador";
const VISTAS_COLAB = ["pedidos", "ventas", "gastos", "inventario", "mas"];
const puede = k => esAdmin() || VISTAS_COLAB.includes(k);
let outbox = readJSON(LS_OUT) || [];

function blank(){ const o = {}; COLS.forEach(c => o[c] = []); o.par = {...PAR_DEF}; return o; }
function readJSON(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function normalize(o){ const b = blank(); if(!o) return b; COLS.forEach(c => b[c] = Array.isArray(o[c]) ? o[c] : []); b.par = {...PAR_DEF, ...(o.par || {})}; return b; }
function fromSeed(){
  const d = window.SEED || {}; const b = blank();
  ["insumos", "recetas", "carta", "proveedores", "fijos"].forEach(c => b[c] = clone(d[c] || []));
  b.par = {...PAR_DEF, ...(d.parametros || {})};
  return b;
}
const hasData = o => o && COLS.some(c => o[c].length);
function saveCache(){ writeJSON(LS_DATA, S); }

function put(col, obj){
  obj.upd = Date.now();
  const a = S[col], i = a.findIndex(x => x.id === obj.id);
  if(i >= 0) a[i] = obj; else a.push(obj);
  queue({op:"put", col, id:obj.id, datos:obj});
}
function del(col, id){
  S[col] = S[col].filter(x => x.id !== id);
  queue({op:"del", col, id});
}
function setPar(p){ S.par = p; queue({op:"put", col:"config", id:"parametros", datos:p}); }
function queue(op){
  saveCache();
  if(mode !== "nube") return;
  outbox = outbox.filter(o => !(o.col === op.col && o.id === op.id));
  outbox.push(op); writeJSON(LS_OUT, outbox);
  flush();
}
let flushing = false, retryT = null;
async function flush(){
  if(flushing || mode !== "nube") return;
  if(!outbox.length) return setSync("ok");
  flushing = true; setSync("busy");
  try{
    while(outbox.length){
      const o = outbox[0];
      const r = o.op === "put"
        ? await sb.from("cuentas").upsert({coleccion:o.col, id:o.id, datos:o.datos, actualizado:new Date().toISOString()})
        : await sb.from("cuentas").delete().match({coleccion:o.col, id:o.id});
      if(r.error) throw r.error;
      outbox.shift(); writeJSON(LS_OUT, outbox);
    }
    setSync("ok");
  }catch(e){
    console.warn("No se pudo guardar en la nube", e);
    setSync("off");
    clearTimeout(retryT); retryT = setTimeout(flush, 20000);
  }finally{ flushing = false; }
}
window.addEventListener("online", flush);
window.addEventListener("beforeunload", e => { if(mode === "nube" && outbox.length && !navigator.onLine){ e.preventDefault(); e.returnValue = ""; } });

function setSync(st){
  const txt = mode === "local" ? "Solo en este dispositivo"
    : st === "busy" ? "Guardando…"
    : st === "off" ? `Sin conexión · ${outbox.length} pendiente${outbox.length === 1 ? "" : "s"}`
    : "Guardado en la nube";
  const cls = "sync " + (mode === "local" ? "local" : st === "busy" ? "busy" : st === "off" ? "off" : "");
  ["sync", "sync2"].forEach(id => { const el = $(id); if(el){ el.className = cls; el.querySelector("span").textContent = txt; } });
}

async function pullAll(){
  const rows = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from("cuentas").select("coleccion,id,datos").order("coleccion").order("id").range(from, from + 999);
    if(error) throw error;
    rows.push(...data);
    if(data.length < 1000) break;
  }
  return rows;
}
// Trae lo que se anotó en otro dispositivo (ej. un pedido confirmado desde el celular) sin tener que recargar.
// Primero compara una "firma" barata (cantidad de filas + última modificación) y solo descarga todo si cambió.
let cloudSig = "";
async function firmaNube(){
  const { data, count, error } = await sb.from("cuentas").select("actualizado", { count:"exact" }).order("actualizado", { ascending:false, nullsFirst:false }).limit(1);
  if(error) throw error;
  return count + "|" + (data[0] ? data[0].actualizado : "");
}
async function refreshCloud(){
  if(mode !== "nube" || !sb || !user || !navigator.onLine || flushing || outbox.length) return;
  try{
    const sig = await firmaNube();
    if(sig === cloudSig) return;
    const rows = await pullAll();
    if(flushing || outbox.length) return;   // se anotó algo mientras bajaba: se reintenta en la próxima vuelta
    cloudSig = sig;
    S = fromRows(rows); saveCache();
    if($("ov").hidden) renderKeep();
  }catch(e){ console.warn("No se pudo revisar la nube", e); }
}
setInterval(() => { if(document.visibilityState === "visible") refreshCloud(); }, 30000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refreshCloud(); });
function fromRows(rows){
  const b = blank();
  rows.forEach(r => {
    if(r.coleccion === "config"){ if(r.id === "parametros") b.par = {...PAR_DEF, ...r.datos}; }
    else if(b[r.coleccion]) b[r.coleccion].push(r.datos);
  });
  // Cambios hechos sin conexión que aún no suben
  outbox.forEach(o => {
    if(o.col === "config"){ if(o.op === "put") b.par = {...PAR_DEF, ...o.datos}; return; }
    if(!b[o.col]) return;
    b[o.col] = b[o.col].filter(x => x.id !== o.id);
    if(o.op === "put") b[o.col].push(o.datos);
  });
  return b;
}
async function uploadAll(){
  const rows = [];
  COLS.forEach(c => S[c].forEach(o => rows.push({coleccion:c, id:o.id, datos:o})));
  rows.push({coleccion:"config", id:"parametros", datos:S.par});
  for(let i = 0; i < rows.length; i += 250){
    const { error } = await sb.from("cuentas").upsert(rows.slice(i, i + 250));
    if(error) throw error;
  }
}
const tableMissing = e => /42P01|PGRST205|does not exist|Could not find the table/i.test((e && (e.code + " " + e.message)) || "");

// =====================================================================
//  Arranque y sesión
// =====================================================================
const cfg = window.SUPABASE || {};
function showOnly(id){ ["boot", "loginView", "app"].forEach(v => $(v).hidden = v !== id); }

async function boot(){
  if(!cfg.url || !cfg.anonKey || !window.supabase){
    mode = "local";
    S = normalize(readJSON(LS_DATA)); if(!hasData(S)){ S = fromSeed(); saveCache(); }
    banner("local-nocfg");
    return startApp();
  }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch(e){}
  if(!session){
    const cache = readJSON(LS_DATA);
    if(!navigator.onLine && cache){ mode = "nube"; rol = readJSON(LS_ROL) || "colaborador"; S = normalize(cache); banner("offline"); return startApp(); }
    return showOnly("loginView");
  }
  enter(session);
}

async function enter(session){
  user = session.user;
  showOnly("boot");
  const cache = readJSON(LS_DATA);
  let r = null;
  try { const x = await sb.rpc("mi_rol"); if(x.error) throw x.error; r = x.data; } catch(e){ r = null; }
  if(r && r !== "administrador" && r !== "colaborador"){
    await sb.auth.signOut();
    showOnly("loginView"); $("lMsg").textContent = "Esta cuenta no tiene acceso. Pide al administrador que te agregue al equipo.";
    return;
  }
  // Sin conexión se usa el último rol conocido en este dispositivo
  rol = r || readJSON(LS_ROL) || "colaborador"; writeJSON(LS_ROL, rol);
  try{
    const rows = await pullAll();
    mode = "nube";
    if(!rows.length && esAdmin()){
      // Nube vacía: se sube lo que haya en este dispositivo o los datos de la planilla
      S = hasData(normalize(cache)) ? normalize(cache) : fromSeed();
      await uploadAll();
      toast("Cuentas creadas en la nube con los datos de tu planilla");
    } else {
      S = fromRows(rows);
    }
    saveCache(); banner(null); startApp(); flush();
    firmaNube().then(s => cloudSig = s, () => {});
  }catch(e){
    if(tableMissing(e)){
      mode = "local";
      S = normalize(cache); if(!hasData(S)){ S = fromSeed(); saveCache(); }
      banner("local-sql");
    } else {
      mode = "nube";
      S = cache ? normalize(cache) : fromSeed();
      banner("offline");
      clearTimeout(retryT); retryT = setTimeout(flush, 20000);
    }
    startApp();
  }
}

// =====================================================================
//  Cálculos (mismas fórmulas de la planilla)
// =====================================================================
const P = () => S.par;
const ivaF = () => 1 + (P().afectaIva ? n0(P().iva) : 0);
const insById = id => S.insumos.find(x => x.id === id);
const recById = id => S.recetas.find(x => x.id === id);
const prodById = id => S.carta.find(x => x.id === id);
// Costo por unidad útil = precio × (1 + flete) ÷ (cantidad × (1 − merma))
function cu(i){ if(!i) return 0; const q = n0(i.cantidad), m = n0(i.merma); if(q <= 0 || m >= 1) return 0; return n0(i.precio) * (1 + n0(P().flete)) / (q * (1 - m)); }
const recCost = code => { const r = recById(code); return r ? sum(r.items || [], it => n0(it.cant) * cu(insById(it.insumo))) : 0; };
const isServ = p => p.categoria === "Servicio";
function prodCost(p){
  if(isServ(p)) return p.costo != null && p.costo !== "" ? n0(p.costo) : n0(P().deliveryCosto);
  return sum(p.partes || [], x => n0(x.veces) * recCost(x.receta));
}
function prodInfo(p){
  const costo = prodCost(p), neto = n0(p.precio) / ivaF(), margen = neto - costo;
  const fco = n0(P().foodCost) || .33;
  const mp = neto ? margen / neto : 0, fc = neto ? costo / neto : 0;
  const sug = isServ(p) ? ceil100(costo * ivaF()) : ceil100(costo / fco * ivaF());
  const estado = isServ(p) ? (margen >= 0 ? "Cubre su costo" : "Pierde plata")
    : !neto ? "Sin precio" : fc > fco + .05 ? "Revisar precio" : fc > fco ? "Ajustado" : "OK";
  return { costo, neto, margen, mp, fc, sug, estado };
}
const estadoCls = e => ({ "OK":"ok", "Cubre su costo":"ok", "Ajustado":"warn", "Revisar precio":"bad", "Pierde plata":"bad" }[e] || "");

function vTot(v){
  const bruto = sum(v.items || [], i => n0(i.cant) * n0(i.precio) - n0(i.desc));
  const costo = sum(v.items || [], i => n0(i.cant) * n0(i.costo));
  const com = n0(v.comision), neto = bruto / ivaF();
  return { bruto, costo, com, neto, margen: neto - costo - com, uds: sum(v.items || [], i => n0(i.cant)) };
}
const totalFijos = () => sum(S.fijos, f => n0(f.monto));
// Primer mes del negocio = el primero con ventas o gastos anotados (si no hay, el mes actual)
const mesInicio = () => [...S.ventas, ...S.gastos].reduce((a, x) => x.fecha && pKey(x.fecha) < a ? pKey(x.fecha) : a, curMonth());
function mes(m){
  const vs = S.ventas.filter(v => pKey(v.fecha) === m);
  const gs = S.gastos.filter(g => pKey(g.fecha) === m);
  let bruto = 0, costo = 0, com = 0, uds = 0;
  vs.forEach(v => { const t = vTot(v); bruto += t.bruto; costo += t.costo; com += t.com; uds += t.uds; });
  const neto = bruto / ivaF(), mc = neto - costo - com;
  // Los costos fijos se cargan en cada mes ya iniciado (hasta hoy), desde el primer mes con movimientos
  const cf = m <= curMonth() && m >= mesInicio() ? totalFijos() : 0;
  const compras = sum(gs.filter(g => g.tipo === "Insumos" || g.tipo === "Empaques"), g => n0(g.monto));
  return { m, vs, gs, bruto, iva: bruto - neto, neto, costo, com, mc, mcp: neto ? mc / neto : 0, cf, util: mc - cf, un: neto ? (mc - cf) / neto : 0,
    uds, pedidos: vs.length, ticket: vs.length ? bruto / vs.length : 0, fc: neto ? costo / neto : 0,
    compras, dif: compras - costo, difp: costo ? (compras - costo) / costo : 0,
    fijosPag: sum(gs.filter(g => g.tipo === "Costo fijo"), g => n0(g.monto)), gastosTot: sum(gs, g => n0(g.monto)) };
}
// Dinero del mes: saldo con que empieza + lo que entra − lo que sale, separado en débito (cuenta) y efectivo.
// Ventas con tarjeta o transferencia entran a la cuenta descontando la comisión; las compras a crédito no salen aún.
function caja(m){
  const s = mes(m), rec = S.saldos.find(x => x.id === m);
  // Sin saldo anotado, el mes empieza con el saldo final del mes anterior (desde el primer mes anotado)
  let ini = rec, traido = false;
  if(!rec && S.saldos.some(x => x.id < m)){
    const p = caja(addMonth(m, -1));
    ini = { debito:p.debito.fin, efectivo:p.efectivo.fin, tarjeta:p.tarjeta.fin }; traido = true;
  }
  const r = { ini, traido, debito:{ ini:n0(ini && ini.debito), ent:0, sal:0, pres:0, pag:0 }, efectivo:{ ini:n0(ini && ini.efectivo), ent:0, sal:0, pres:0, pag:0 }, tarjeta:{ ini:n0(ini && ini.tarjeta), ent:0, sal:0, pres:0, pag:0 }, credito:0 };
  s.vs.forEach(v => { const t = vTot(v); if(v.pago === "Efectivo") r.efectivo.ent += t.bruto; else r.debito.ent += t.bruto - t.com; });
  s.gs.forEach(g => { const x = n0(g.monto);
    if(g.pago === "Efectivo") r.efectivo.sal += x;
    else if(g.pago === "Tarjeta de crédito") r.tarjeta.sal += x;
    else if(g.pago === "Crédito proveedor") r.credito += x;
    else r.debito.sal += x; });
  // Lo que ponen o devuelven los dueños entra; lo que se les devuelve, paga o presta sale
  S.duenos.filter(x => pKey(x.fecha) === m).forEach(x => { const c = x.medio === "Efectivo" ? r.efectivo : r.debito;
    if(ENTRA_D.includes(x.tipo)) c.pres += n0(x.monto); else c.pag += n0(x.monto); });
  [r.debito, r.efectivo, r.tarjeta].forEach(c => c.fin = c.ini + c.ent - c.sal + c.pres - c.pag);
  return r;
}
// Dinero apartado para pagos del mes: los costos fijos del negocio + otros pagos (tarjeta de crédito, etc.).
// Por mes se guarda { det: { "f:<fijo>" | "r:<reserva>": { monto, apartado, pagado } } }; monto vacío = el monto habitual.
function apartados(m){
  const rec = S.apartados.find(x => x.id === m) || { id:m, det:{} };
  const row = (key, item, base, sub, edit) => { const d = rec.det[key] || {}; return { key, item, sub, edit, base:n0(base), monto:d.monto ?? n0(base), apartado:n0(d.apartado), pagado:!!d.pagado }; };
  const fijos = S.fijos.map(f => row("f:" + f.id, f.item, f.monto, f.categoria));
  const otros = S.reservas.slice().sort((a, b) => String(a.item).localeCompare(String(b.item), "es")).map(r => row("r:" + r.id, r.item, r.monto, r.nota, r.id));
  const all = [...fijos, ...otros], pend = all.filter(r => !r.pagado);
  return { rec, fijos, otros, all, total:sum(all, r => r.monto), apartado:sum(all, r => r.apartado),
    falta:sum(pend, r => Math.max(r.monto - r.apartado, 0)), guardado:sum(pend, r => r.apartado), pagados:all.length - pend.length };
}
function equilibrio(){
  const cf = totalFijos();
  let N = 0, MC = 0;
  S.ventas.forEach(v => { const t = vTot(v); N += t.neto; MC += t.margen; });
  const prods = S.carta.filter(p => !isServ(p) && p.activo !== false).map(p => prodInfo(p).mp).filter(x => x > 0);
  const mcp = N > 0 ? MC / N : prods.length ? sum(prods) / prods.length : 0;
  const fuente = N > 0 ? "ventas reales" : "promedio de la carta";
  const dias = n0(P().dias) || 1, ticket = n0(P().ticket) || 1;
  const netoEq = mcp > 0 ? cf / mcp : 0, brutoEq = netoEq * ivaF(), diaEq = brutoEq / dias;
  const metaBruto = mcp > 0 ? (cf + n0(P().meta)) / mcp * ivaF() : 0, metaDia = metaBruto / dias;
  return { cf, mcp, fuente, netoEq, brutoEq, diaEq, pedEq: Math.ceil(diaEq / ticket - 1e-9), metaBruto, metaDia, pedMeta: Math.ceil(metaDia / ticket - 1e-9), dias, ticket };
}
function invEstado(i){
  if(i.stock == null || i.stock === "") return "Contar";
  if(i.minimo == null || i.minimo === "") return "Sin mínimo";
  return n0(i.stock) < n0(i.minimo) ? "COMPRAR" : "OK";
}

  vs.forEach(v => {

    const t = vTot(v);

// ---------- Dueños: préstamos y pagos ----------
// Totales de cada dueño desde el primer registro, en los dos sentidos:
// debe = lo que el local le debe al dueño; leDebe = lo que el dueño le debe al local
function porDueno(){
  const por = {};
  S.duenos.forEach(x => { const d = por[x.dueno] = por[x.dueno] || { dueno:x.dueno, prestamo:0, devolucion:0, pago:0, prestamo_local:0, abono:0 }; d[x.tipo] += n0(x.monto); });
  return Object.values(por).map(d => ({ ...d, debe:d.prestamo - d.devolucion, leDebe:d.prestamo_local - d.abono })).sort((a, b) => a.dueno.localeCompare(b.dueno, "es"));
}
R.duenos = () => {
  const ms = S.duenos.filter(x => pKey(x.fecha) === curM).sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.upd || 0) - (a.upd || 0));
  const tot = t => sum(ms.filter(x => x.tipo === t), x => n0(x.monto));
  const ds = porDueno(), btn = `<button class="b acc" data-act="newDueno">${ico("plus")}Registrar movimiento</button>`;
  let h = "", day = "";
  ms.forEach(x => {
    if(x.fecha !== day){ day = x.fecha; h += `<div class="day"><span>${dName(day)}</span></div>`; }
    h += `<button class="item" data-act="editDueno" data-id="${esc(x.id)}">
      <div class="main-t"><div class="tt">${esc(x.dueno)}</div><div class="st">${TIPOS_D[x.tipo]} · ${esc(x.medio)}${x.nota ? " · " + esc(x.nota) : ""}</div></div>
      <div class="am num ${ENTRA_D.includes(x.tipo) ? "pos" : ""}">${ENTRA_D.includes(x.tipo) ? "+" : "−"}${fmt(x.monto)}</div></button>`;
  });
  const debeA = sum(ds, d => d.debe), debenA = sum(ds, d => d.leDebe);
  return `
  <div class="kpis">
    ${kpi("El local les debe", fmt(debeA), "préstamos de los dueños sin devolver", "hero")}
    ${kpi("Le deben al local", fmt(debenA), "préstamos del local sin devolver")}
    ${kpi("Entró de los dueños", fmt(tot("prestamo") + tot("abono")), "este mes")}
    ${kpi("Salió a los dueños", fmt(tot("devolucion") + tot("pago") + tot("prestamo_local")), `este mes · ${fmt(tot("pago"))} en pagos`)}
  </div>
  ${ds.length ? `<div class="card mt"><h2>Por dueño</h2><div class="tw"><table>
    <thead><tr><th>Dueño</th><th class="n">El local le debe</th><th class="n">Le debe al local</th><th class="n">Pagos recibidos</th></tr></thead><tbody>
    ${ds.map(d => `<tr><td><b>${esc(d.dueno)}</b></td>
      <td class="n"><b class="${d.debe > 0 ? "neg" : ""}">${fmt(d.debe)}</b><div class="small muted">prestó ${fmt(d.prestamo)} · devuelto ${fmt(d.devolucion)}</div></td>
      <td class="n"><b>${fmt(d.leDebe)}</b><div class="small muted">recibió ${fmt(d.prestamo_local)} · devolvió ${fmt(d.abono)}</div></td>
      <td class="n">${fmt(d.pago)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint">Totales desde el primer registro. No son ventas ni gastos, así que no cambian la utilidad, pero sí el dinero del mes en el <a href="#inicio">Resumen</a>.</p></div>` : ""}
  <div class="row mt"><h2 style="margin:0;font-size:1rem">Movimientos de ${mName(curM)}</h2><span class="sp"></span>${btn}</div>
  <div class="list" style="margin-top:6px">${h || empty("users", "Sin movimientos en " + mName(curM), "Anota los préstamos entre los dueños y el local (en los dos sentidos), sus devoluciones y lo que se les paga.", btn)}</div>`;
};

      <td class="n"><div class="unit"><input class="tin num" type="number" inputmode="decimal" min="0" step="any" data-inv="minimo" data-id="${esc(i.id)}" value="${i.minimo ?? ""}" aria-label="Mínimo de ${esc(i.nombre)}"><em>${esc(i.unidad)}</em></div></td>
      <td><span class="pill ${invCls(e)}">${e}</span></td>

      <td class="small muted hide-sm">${i.conteo ? new Date(i.conteo + "T12:00").toLocaleDateString("es-CL", {day:"numeric", month:"short"}) : ""}</td></tr>`; }).join("") || `<tr><td colspan="6" class="muted">Nada que comprar. 🎉</td></tr>`}
    </tbody></table></div></div>`;

// ---------- Resultados ----------
R.resultados = () => {
  const ms = Array.from({length:12}, (_, i) => addMonth(curM, i - 11));
  const D = ms.map(mes);
  const T = k => sum(D, d => d[k]);
  const tN = T("neto"), tMC = T("mc"), tC = T("costo"), tCompras = T("compras");

      ${line("Ventas netas", "neto", fmt, "sub")}

      ${line("(−) Comisiones medios de pago", "com")}

function openModal(title, body, foot, cls = ""){
  const ov = $("ov");
  ov.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="mh"><h2>${title}</h2><button class="ib" data-act="close" aria-label="Cerrar">${ico("x")}</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ""}</div>`;
  ov.hidden = false; document.body.style.overflow = "hidden";
  const first = ov.querySelector(".mb input:not([type=checkbox]):not([type=date]), .mb select");
  if(first && matchMedia("(min-width:760px)").matches) first.focus();
  return ov.querySelector(".modal");
}
function closeModal(){ $("ov").hidden = true; $("ov").innerHTML = ""; document.body.style.overflow = ""; }
$("ov").addEventListener("mousedown", e => { if(e.target === $("ov")) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("ov").hidden) closeModal(); });
const chipsHTML = (name, opts, val) => `<div class="chips" data-chips="${name}">${opts.map(o => `<button type="button" class="chip ${o === val ? "on" : ""}" data-val="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
const chipVal = (root, name) => { const c = root.querySelector(`[data-chips="${name}"] .chip.on`); return c ? c.dataset.val : ""; };
function wireChips(root, onChange){
  root.querySelectorAll("[data-chips]").forEach(g => g.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if(!c) return;
    g.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
    onChange && onChange(g.dataset.chips, c.dataset.val);
  }));
}
// Confirmación propia de la app: el confirm() del navegador no aparece en algunas apps instaladas
// (o si se marcó "no mostrar más diálogos") y responde "no" solo, dejando el botón sin efecto.
function ask(msg, ok = "Aceptar", danger = false){
  return new Promise(res => {
    const d = document.createElement("div");
    d.className = "overlay ask";
    d.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><div class="mb"><p style="margin:4px 0 0;white-space:pre-line;font-size:15px">${esc(msg)}</p></div>
      <div class="mf"><span class="sp"></span><button class="b" data-r="0">Cancelar</button><button class="b ${danger ? "del" : "pri"}" data-r="1">${esc(ok)}</button></div></div>`;
    const end = v => { d.remove(); document.removeEventListener("keydown", key, true); res(v); };
    const key = e => { if(e.key === "Escape"){ e.stopPropagation(); end(false); } };
    d.addEventListener("click", e => { e.stopPropagation(); const b = e.target.closest("[data-r]"); if(b) end(b.dataset.r === "1"); else if(e.target === d) end(false); });
    document.addEventListener("keydown", key, true);
    document.body.appendChild(d);
    d.querySelector('[data-r="1"]').focus();
  });
}
const confirmDel = (t, ok = "Eliminar") => ask(t + "\n\nEsta acción no se puede deshacer.", ok, true);

    <label for="vNota">Nota (opcional)</label><input id="vNota" value="${esc(v.nota || "")}" placeholder="Ej: cliente, dirección, cambio de salsa">`;
  const foot = `<div class="tot" id="vTot"></div><span class="sp"></span>
    ${orig && esAdmin() ? `<button class="b del" data-act="delVenta" data-id="${esc(v.id)}">${ico("trash")}</button>` : ""}
    <button class="b" data-act="close">Cancelar</button><button class="b acc" id="vSave">Guardar venta</button>`;
  const m = openModal(opt.title || (orig ? `Venta #${esc(v.num)}` : "Nueva venta"), body, foot, "full");
  wireChips(m, () => draw());
  function draw(){
    const L = m.querySelector("#vLines");
    L.innerHTML = v.items.map((it, k) => `<div class="line">
      <div class="lt"><b>${esc(it.nombre)}</b><span class="num">${fmt(n0(it.cant) * n0(it.precio) - n0(it.desc))}</span><button type="button" class="ib" data-rm="${k}" aria-label="Quitar">${ico("trash")}</button></div>
      <div class="lc">
        <div><label>Cantidad</label><div class="step"><button type="button" data-dq="${k}" data-d="-1">−</button><input type="number" inputmode="decimal" min="0" step="any" data-f="cant" data-k="${k}" value="${it.cant}"><button type="button" data-dq="${k}" data-d="1">+</button></div></div>
        <div><label>Precio unitario</label><input type="number" inputmode="numeric" min="0" step="100" data-f="precio" data-k="${k}" value="${it.precio}"></div>
        <div><label>Descuento $</label><input type="number" inputmode="numeric" min="0" step="100" data-f="desc" data-k="${k}" value="${it.desc || ""}" placeholder="0"></div>
      </div></div>`).join("") || `<p class="muted small" style="margin:6px 0">Aún no agregas productos.</p>`;
    m.querySelectorAll("[data-add]").forEach(b => {
      const q = sum(v.items.filter(i => i.prod === b.dataset.add), i => n0(i.cant));
      b.classList.toggle("on", q > 0);
      let badge = b.querySelector(".q");
      if(q > 0){ if(!badge){ badge = document.createElement("span"); badge.className = "q"; b.appendChild(badge); } badge.textContent = qty(q); }
      else if(badge) badge.remove();
    });
    totals();
  }
  function totals(){
    const pago = chipVal(m, "pago");
    const t = vTot({ ...v, comision: 0 });
    const com = pago === "Tarjeta / link de pago" ? t.bruto * n0(P().comision) : 0;
    m.querySelector("#vTot").innerHTML = `Total<b class="num">${fmt(t.bruto)}</b>margen ${fmt(t.margen - com)}${com ? ` · comisión ${fmt(com)}` : ""}`;
  }
  m.addEventListener("click", e => {
    const a = e.target.closest("[data-add]");
    if(a){
      const p = prodById(a.dataset.add);
      const ex = v.items.find(i => i.prod === p.id && n0(i.precio) === n0(p.precio));
      if(ex) ex.cant = n0(ex.cant) + 1; else v.items.push({ prod:p.id, nombre:p.nombre, cant:1, precio:n0(p.precio), desc:0, costo:prodCost(p) });
      return draw();
    }
    const rm = e.target.closest("[data-rm]"); if(rm){ v.items.splice(+rm.dataset.rm, 1); return draw(); }
    const dq = e.target.closest("[data-dq]");
    if(dq){ const it = v.items[+dq.dataset.dq]; it.cant = Math.max(0, n0(it.cant) + n0(dq.dataset.d)); if(!it.cant) v.items.splice(+dq.dataset.dq, 1); return draw(); }
  });
  m.addEventListener("input", e => {
    const f = e.target.dataset.f; if(!f) return;
    v.items[+e.target.dataset.k][f] = n0(e.target.value);
    const k = +e.target.dataset.k, it = v.items[k];
    e.target.closest(".line").querySelector(".lt .num").textContent = fmt(n0(it.cant) * n0(it.precio) - n0(it.desc));
    totals();
  });
  m.addEventListener("change", e => { if(e.target.dataset.f === "cant") draw(); });
  m.querySelector("#vSave").onclick = () => {
    v.items = v.items.filter(i => n0(i.cant) > 0);
    if(!v.items.length) return toast("Agrega al menos un producto", true);
    v.fecha = m.querySelector("#vF").value; if(!v.fecha) return toast("Elige la fecha", true);
    v.num = n0(m.querySelector("#vN").value) || nextNum();
    v.canal = chipVal(m, "canal"); v.pago = chipVal(m, "pago");
    v.nota = m.querySelector("#vNota").value.trim();
    v.comision = v.pago === "Tarjeta / link de pago" ? vTot({ ...v, comision:0 }).bruto * n0(P().comision) : 0;
    put("ventas", v); closeModal();
    if(opt.onSaved) opt.onSaved(v);
    curM = pKey(v.fecha); render();
    toast(orig ? "Venta actualizada" : `Venta #${v.num} guardada · ${fmt(vTot(v).bruto)}`);
  };
  draw();
}

//  Pedidos que llegan desde la página (tabla "pedidos" en Supabase)
//  Entran como "pendiente"; solo al confirmarlos se registran como venta.
// =====================================================================
const PED = { list:[], ok:false, err:"", filtro:"pendiente", n:0, first:true };
const PED_EST = { pendiente:["Por confirmar", "warn"], confirmado:["Confirmado", "ok"] };
async function loadPedidos(){
  if(!sb || !user || !navigator.onLine) return;
  const desde = new Date(Date.now() - 60 * 864e5).toISOString();
  let { data, error } = await sb.from("pedidos").select("*").or(`estado.eq.pendiente,creado.gte."${desde}"`).order("creado", { ascending:false }).limit(300);
  if(error){ PED.err = tableMissing(error) ? "sql" : error.message; }
  else {
    PED.err = ""; PED.ok = true; PED.at = new Date();
    // Rechazados de versiones anteriores: se eliminan
    if(data.some(p => p.estado === "rechazado")){
      const { error: e2 } = await sb.from("pedidos").delete().eq("estado", "rechazado");
      if(!e2) data = data.filter(p => p.estado !== "rechazado");
    }
    PED.list = data.filter(p => p.estado !== "rechazado");
    // Si la venta se guardó pero el pedido no alcanzó a marcarse (sin conexión), se corrige ahora
    PED.list.filter(p => p.estado === "pendiente").forEach(p => { const v = S.ventas.find(x => x.pedidoWeb === p.id); if(v) marcarPedido(p, "confirmado", v.id, true); });
  }
  const n = PED.list.filter(p => p.estado === "pendiente").length;
  if(!PED.first && n > PED.n){ toast("🛎️ Llegó un pedido nuevo de la página"); try { navigator.vibrate && navigator.vibrate(200); } catch(e){} }
  PED.n = n; PED.first = false;
  updateBadge();
  if((view === "pedidos" || view === "inicio") && $("ov").hidden) renderKeep();
}
setInterval(() => { if(document.visibilityState === "visible") loadPedidos(); }, 30000);

// Si la app quedó abierta (o instalada en el teléfono) con una versión antigua, avisa y se actualiza
const APP_VERSION = "2026-10-18a";
async function checkVersion(){
  try{
    const html = await (await fetch(location.pathname + "?v=" + Date.now(), { cache:"no-store" })).text();
    const m = html.match(/const APP_VERSION = "([^"]+)"/);
    if(m && m[1] !== APP_VERSION && !$("upd")){
      const b = document.createElement("div");
      b.id = "upd"; b.className = "banner info";
      b.innerHTML = `${ico("info")}<div>Hay una versión nueva de la app. <button class="b sm pri" style="margin-left:6px" onclick="location.reload()">Actualizar ahora</button></div>`;
      $("banner").prepend(b);
    }
  }catch(e){}
}
setInterval(() => { if(document.visibilityState === "visible") checkVersion(); }, 5 * 60000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") checkVersion(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") loadPedidos(); });
function updateBadge(){
  const n = PED.list.filter(p => p.estado === "pendiente").length;
  document.querySelectorAll("[data-nb]").forEach(e => { e.textContent = n; e.hidden = !n; });
}
async function marcarPedido(p, estado, ventaId = null, quiet){
  const { error } = await sb.from("pedidos").update({ estado, venta_id: ventaId, revisado: estado === "pendiente" ? null : new Date().toISOString() }).eq("id", p.id);
  if(error){ if(!quiet) toast("No se pudo actualizar el pedido: " + error.message, true); return false; }
  const local = PED.list.find(x => x.id === p.id);
  Object.assign(local || p, { estado, venta_id: ventaId });
  PED.n = PED.list.filter(x => x.estado === "pendiente").length;
  updateBadge();
  if($("ov").hidden && (view === "pedidos" || view === "inicio")) render();
  return true;
}
// Los pedidos rechazados se eliminan de la base de datos para no acumular registros
async function borrarPedido(p){
  const { error } = await sb.from("pedidos").delete().eq("id", p.id);
  if(error){ toast("No se pudo eliminar el pedido: " + error.message, true); return false; }
  PED.list = PED.list.filter(x => x.id !== p.id);
  PED.n = PED.list.filter(x => x.estado === "pendiente").length;
  updateBadge();
  return true;
}
function hace(iso){
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if(min < 1) return "recién";
  if(min < 60) return `hace ${min} min`;
  if(min < 24 * 60) return `hace ${Math.round(min / 60)} h`;
  return new Date(iso).toLocaleDateString("es-CL", { day:"numeric", month:"short" });
}
const pedItems = p => (p.items || []).map(i => `${i.top ? "+ " : ""}${i.q}× ${i.n}`).join(", ");
const telWa = t => { const d = String(t || "").replace(/\D/g, ""); return d.length === 9 ? "56" + d : d.length === 8 ? "569" + d : d; };

// Relaciona el nombre de la página ("Tabla 30 piezas Mixta") con el producto de la carta ("Tabla Mixta 30")
const STOP = new Set(["topping", "piezas", "pieza", "de", "con", "y", "el", "la", "en"]);
const toks = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").split(" ").filter(w => w && !STOP.has(w));
function matchProd(name){
  const map = P().webMap || {};
  if(map[name] && prodById(map[name])) return map[name];
  const a = new Set(toks(name)); let best = "", bs = 0;
  S.carta.forEach(p => {
    const b = new Set(toks(p.nombre)), inter = [...a].filter(x => b.has(x)).length;
    const s = inter / ((a.size + b.size - inter) || 1);
    if(s > bs){ bs = s; best = p.id; }
  });
  return bs >= .5 ? best : "";
}

      ${(p.items || []).map((it, k) => `<tr><td>${it.top ? "+ " : ""}<b>${esc(it.q)}× ${esc(it.n)}</b>${it.d ? `<div class="small muted">${esc(it.d)}</div>` : ""}</td>

        ${pend ? `<td style="min-width:190px"><select data-map="${k}"><option value="">— Elige producto —</option>${opts}<option value="__sin">Sin producto (costo $0)</option></select></td>` : ""}</tr>`).join("")}
      <tr class="tot"><td>Total del pedido${p.entrega === "Delivery" ? " (sin despacho)" : ""}</td><td class="n">${fmt(p.total)}</td>${pend ? "<td></td>" : ""}</tr>
    </tbody></table></div>
    ${pend ? `<p class="hint mt">Al confirmar se abre la venta ya armada para que la revises${p.entrega === "Delivery" ? ", con el cobro de delivery incluido" : ""}. Solo cuando la guardes queda registrada en las cuentas.</p>` : ""}
    ${p.estado === "confirmado" ? `<p class="hint mt">${venta ? `Registrado como venta #${esc(venta.num)} del ${dName(venta.fecha)} por ${fmt(vTot(venta).bruto)}.` : "La venta de este pedido ya no está en las cuentas."}</p>` : ""}`;
  const wa = `https://wa.me/${telWa(p.telefono)}?text=${encodeURIComponent(`Hola ${p.cliente}, te escribimos de Saisei & Co por tu pedido N° ${p.codigo}.`)}`;
  const foot = `<a class="b" href="${esc(wa)}" target="_blank" rel="noopener">${ico("phone")}WhatsApp</a><span class="sp"></span>
    ${pend ? `<button class="b del" data-act="rechPedido" data-id="${p.id}">Rechazar</button><button class="b acc" id="pConf">${ico("check")}Confirmar</button>` : ""}
    ${p.estado === "confirmado" && venta ? `<button class="b" data-act="editVenta" data-id="${esc(venta.id)}">Ver venta</button>` : ""}`;
  const m = openModal(`Pedido N° ${esc(p.codigo)}`, body, foot, "wide");

  };
}

// Editor de filas genérico (partes de un producto o ingredientes de una receta)
function wireRows(box, rows, blankRow, redraw, recalc){
  box.addEventListener("click", e => {
    if(e.target.closest("[data-addrow]")){ rows.push(blankRow()); redraw(); const sel = box.querySelectorAll("select"); sel[sel.length - 1]?.focus(); return; }
    const rm = e.target.closest("[data-rmrow]"); if(rm){ rows.splice(+rm.dataset.rmrow, 1); redraw(); }
  });
  box.addEventListener("input", e => {
    const k = e.target.dataset.k; if(k == null) return;
    if(e.target.dataset.f === "ref"){ rows[k].ref = e.target.value; redraw(); } else { rows[k].q = e.target.value; recalc(); }
  });
  box.addEventListener("change", e => { if(e.target.dataset.f === "ref"){ rows[e.target.dataset.k].ref = e.target.value; redraw(); } });
}

      pago: "Resta del dinero del mes. No cambia ninguna deuda.",
      prestamo_local: "Resta del dinero del mes y queda como deuda de este dueño con el local.",
      abono: `Suma al dinero del mes y baja lo que el dueño le debe al local${d ? ` (hoy debe ${fmt(d.leDebe)})` : ""}.`,
    }[t];
  };
  wireChips(m, hint); m.querySelector("#dD").oninput = hint; hint();
  m.querySelector("#dSave").onclick = () => {
    const t = { ...x, fecha:m.querySelector("#dF").value, monto:n0(m.querySelector("#dM").value), dueno:m.querySelector("#dD").value.trim(), tipo:tipo(), medio:chipVal(m, "medio"), nota:m.querySelector("#dN").value.trim() };
    if(!t.fecha) return toast("Elige la fecha", true);
    if(!(t.monto > 0)) return toast("Escribe el monto", true);
    if(!t.dueno) return toast("Escribe el nombre del dueño", true);
    put("duenos", t); closeModal(); curM = pKey(t.fecha); render();
    toast(orig ? "Movimiento actualizado" : "Movimiento guardado");
  };
}
function formReserva(orig){
  const r = orig ? clone(orig) : { id:uid(), item:"", monto:"", nota:"" };
  const m = openModal(orig ? "Editar pago" : "Otro pago para apartar", `
    <label for="rI">Pago</label><input id="rI" value="${esc(r.item)}" placeholder="Ej: Tarjeta de crédito">
    <div class="f2">
      <div><label for="rM">Monto habitual al mes</label><div class="unit pre"><em>$</em><input id="rM" type="number" inputmode="numeric" min="0" step="1000" value="${esc(r.monto)}"></div></div>
      <div><label for="rN">Nota</label><input id="rN" value="${esc(r.nota || "")}" placeholder="Ej: vence el día 5"></div>
    </div>
    <p class="hint">No se suma a los costos fijos del negocio; solo sirve para apartar el dinero.</p>`,
    `${orig ? `<button class="b del" data-act="delReserva" data-id="${esc(r.id)}">${ico("trash")}Eliminar</button>` : ""}<span class="sp"></span><button class="b" data-act="close">Cancelar</button><button class="b pri" id="rSave2">Guardar</button>`);
  m.querySelector("#rSave2").onclick = () => {
    const t = { ...r, item:m.querySelector("#rI").value.trim(), monto:n0(m.querySelector("#rM").value), nota:m.querySelector("#rN").value.trim() };
    if(!t.item) return toast("Escribe el nombre del pago", true);
    put("reservas", t); closeModal(); render(); toast("Pago guardado");
  };
}
function formProv(orig){
  const p = orig ? clone(orig) : { id:uid(), nombre:"", rubro:"", contacto:"", telefono:"", ciudad:"", dias:"", pago:"", web:"" };
  const F = (k, l, ph = "") => `<div><label for="pv_${k}">${l}</label><input id="pv_${k}" value="${esc(p[k] || "")}" placeholder="${ph}"></div>`;
  const tel = (p.telefono || "").replace(/\D/g, "");
  const m = openModal(orig ? "Editar proveedor" : "Nuevo proveedor", `
    ${F("nombre", "Nombre")}${F("rubro", "Qué le compras")}
    <div class="f2">${F("contacto", "Contacto")}${F("telefono", "Teléfono / WhatsApp", "+56 9 …")}${F("ciudad", "Ciudad / despacho")}${F("dias", "Días de entrega")}${F("pago", "Condición de pago")}${F("web", "Sitio web / nota")}</div>
    ${tel.length >= 8 ? `<div class="row mt"><a class="b" href="https://wa.me/${tel.length === 9 ? "56" + tel : tel}" target="_blank" rel="noopener">${ico("phone")}Escribir por WhatsApp</a></div>` : ""}`,
    `${orig ? `<button class="b del" data-act="delProv" data-id="${esc(p.id)}">${ico("trash")}Eliminar</button>` : ""}<span class="sp"></span><button class="b" data-act="close">Cancelar</button><button class="b pri" id="pvSave">Guardar</button>`);
  m.querySelector("#pvSave").onclick = () => {
    const t = { ...p }; ["nombre", "rubro", "contacto", "telefono", "ciudad", "dias", "pago", "web"].forEach(k => t[k] = m.querySelector("#pv_" + k).value.trim());
    if(!t.nombre) return toast("Escribe el nombre", true);
    if(orig && orig.nombre !== t.nombre) S.insumos.filter(i => i.proveedor === orig.nombre).forEach(i => { i.proveedor = t.nombre; put("insumos", i); });
    put("proveedores", t); closeModal(); render(); toast("Proveedor guardado");
  };
}

// =====================================================================
//  Excel (CSV) y respaldos
// =====================================================================
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCell = v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => "﻿" + rows.map(r => r.map(csvCell).join(";")).join("\r\n");
function csvVentas(){
  const rows = [["Fecha", "N° pedido", "Canal", "Producto", "Cantidad", "Precio unitario ($)", "Descuento ($)", "Total venta ($)", "Medio de pago", "Comisión ($)", "Costo directo ($)", "Margen ($)", "Mes", "Notas"]];
  S.ventas.slice().sort((a, b) => a.fecha.localeCompare(b.fecha) || n0(a.num) - n0(b.num)).forEach(v => {
    const t = vTot(v);
    v.items.forEach(i => {
      const tot = n0(i.cant) * n0(i.precio) - n0(i.desc), com = t.bruto ? t.com * tot / t.bruto : 0, costo = n0(i.cant) * n0(i.costo);
      rows.push([v.fecha, v.num, v.canal, i.nombre, i.cant, Math.round(n0(i.precio)), Math.round(n0(i.desc)), Math.round(tot), v.pago, Math.round(com), Math.round(costo), Math.round(tot / ivaF() - costo - com), mName(pKey(v.fecha)), v.nota || ""]);
    });
  });
  download("ventas-saisei.csv", toCSV(rows), "text/csv;charset=utf-8"); toast("Ventas descargadas (se abren en Excel)");
}
function csvGastos(){
  const rows = [["Fecha", "Tipo", "Proveedor", "Descripción", "Monto ($)", "N° boleta / factura", "Medio de pago", "Mes"]];
  S.gastos.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(g => rows.push([g.fecha, g.tipo, g.proveedor, g.desc, Math.round(n0(g.monto)), g.doc, g.pago, mName(pKey(g.fecha))]));
  download("gastos-saisei.csv", toCSV(rows), "text/csv;charset=utf-8"); toast("Gastos descargados (se abren en Excel)");
}
function backup(){ download(`respaldo-cuentas-saisei-${today()}.json`, JSON.stringify({ app:"saisei-cuentas", version:1, fecha:new Date().toISOString(), datos:S }, null, 1), "application/json"); toast("Respaldo descargado"); }
async function restore(file){
  try{
    const j = JSON.parse(await file.text());
    const d = normalize(j.datos || j);
    if(!hasData(d)) throw new Error("vacío");
    if(!(await ask(`Restaurar el respaldo reemplazará las cuentas actuales por:\n${d.ventas.length} ventas, ${d.gastos.length} gastos, ${d.insumos.length} insumos, ${d.carta.length} productos.\n\n¿Continuar?`, "Restaurar"))) return;
    const old = S;
    S = d; saveCache();
    if(mode === "nube"){
      // Se borra en la nube lo que no está en el respaldo y se sube lo nuevo
      COLS.forEach(c => old[c].forEach(o => { if(!S[c].some(x => x.id === o.id)) queue({ op:"del", col:c, id:o.id }); }));
      COLS.forEach(c => S[c].forEach(o => queue({ op:"put", col:c, id:o.id, datos:o })));
      queue({ op:"put", col:"config", id:"parametros", datos:S.par });
    }
    render(); toast("Respaldo restaurado");
  }catch(e){ toast("Ese archivo no es un respaldo válido", true); }
}

// =====================================================================
//  Acciones (clics delegados)
// =====================================================================
const A = {
  close: closeModal,
  fab: () => view === "gastos" ? formGasto() : formVenta(),
  mprev: () => { curM = addMonth(curM, -1); render(); },
  mnext: () => { curM = addMonth(curM, 1); render(); },
  newVenta: () => formVenta(),
  editVenta: d => formVenta(S.ventas.find(v => v.id === d.id)),
  delVenta: async d => {
    const v = S.ventas.find(x => x.id === d.id);
    if(!(await confirmDel(v && v.pedidoWeb ? "¿Eliminar esta venta?\nEl pedido de la página volverá a quedar por confirmar." : "¿Eliminar esta venta?"))) return;
    del("ventas", d.id); closeModal(); render(); toast("Venta eliminada");
    if(v && v.pedidoWeb && sb && user) marcarPedido(PED.list.find(p => p.id === v.pedidoWeb) || { id:v.pedidoWeb }, "pendiente", null);
  },
  pedF: d => { PED.filtro = d.f; render(); },
  reloadPed: async () => { await loadPedidos(); toast("Pedidos actualizados"); },
  detPedido: d => detPedido(d.id),
  rechPedido: async d => {
    const p = PED.list.find(x => String(x.id) === d.id);
    if(!p) return;
    if(!(await ask(`¿Rechazar el pedido N° ${p.codigo} de ${p.cliente}?\nSe eliminará y no se registrará en las cuentas. Avísale al cliente por WhatsApp.`, "Rechazar pedido", true))) return;
    if(await borrarPedido(p)){ closeModal(); render(); toast("Pedido rechazado y eliminado"); }
  },
  newGasto: () => formGasto(),
  editSaldo: () => formSaldo(),
  editGasto: d => formGasto(S.gastos.find(g => g.id === d.id)),
  delGasto: async d => { if(await confirmDel("¿Eliminar este gasto?")){ del("gastos", d.id); closeModal(); render(); toast("Gasto eliminado"); } },
  gTipo: d => { UI.gastoTipo = d.t; render(); },
  cartaF: d => { UI.cartaF = d.f; render(); },
  detProd: d => detProd(d.id),
  newProd: () => formProd(),
  editProd: d => formProd(prodById(d.id)),
  applySug: async d => { const p = prodById(d.id), s = prodInfo(p).sug; if(await ask(`¿Cambiar el precio de ${p.nombre} de ${fmt(p.precio)} a ${fmt(s)}?`, "Cambiar precio")){ p.precio = s; put("carta", p); closeModal(); render(); toast("Precio actualizado"); } },
  delProd: async d => { const p = prodById(d.id); if(await confirmDel(`¿Eliminar ${p.nombre} de la carta?\nLas ventas ya registradas no cambian.`)){ del("carta", d.id); closeModal(); render(); toast("Producto eliminado"); } },
  newRec: () => formRec(),
  editRec: d => formRec(recById(d.id)),
  delRec: async d => {
    const used = S.carta.filter(p => (p.partes || []).some(x => x.receta === d.id));
    if(used.length) return toast("Primero quítala de: " + used.map(p => p.nombre).join(", "), true);
    if(await confirmDel("¿Eliminar esta receta?")){ del("recetas", d.id); closeModal(); render(); toast("Receta eliminada"); }
  },
  newIns: () => formIns(),
  editIns: d => formIns(insById(d.id)),
  delIns: async d => {
    const used = S.recetas.filter(r => (r.items || []).some(x => x.insumo === d.id));
    if(used.length) return toast("Se usa en: " + used.map(r => r.id).join(", ") + ". Quítalo de esas recetas primero.", true);
    if(await confirmDel("¿Eliminar este insumo?")){ del("insumos", d.id); closeModal(); render(); toast("Insumo eliminado"); }
  },
  newFijo: () => formFijo(),
  editFijo: d => formFijo(S.fijos.find(f => f.id === d.id)),
  delFijo: async d => { if(await confirmDel("¿Eliminar este costo fijo?")){ del("fijos", d.id); closeModal(); render(); } },
  newReserva: () => formReserva(),
  editReserva: d => formReserva(S.reservas.find(r => r.id === d.id)),
  newDueno: () => formDueno(),
  editDueno: d => formDueno(S.duenos.find(x => x.id === d.id)),
  delDueno: async d => { if(await confirmDel("¿Eliminar este movimiento?")){ del("duenos", d.id); closeModal(); render(); toast("Movimiento eliminado"); } },
  delReserva: async d => { if(await confirmDel("¿Eliminar este pago?\nDeja de aparecer en todos los meses.")){ del("reservas", d.id); closeModal(); render(); } },
  apartarTodo: () => {
    const a = apartados(curM);
    a.all.filter(r => !r.pagado && r.apartado < r.monto).forEach(r => a.rec.det[r.key] = { ...a.rec.det[r.key], apartado:r.monto });
    put("apartados", a.rec); render(); toast("Todo apartado");
  },
  newProv: () => formProv(),
  editProv: d => formProv(S.proveedores.find(p => p.id === d.id)),
  delProv: async d => { if(await confirmDel("¿Eliminar este proveedor?")){ del("proveedores", d.id); closeModal(); render(); } },
  listaCompras: async () => {
    const l = S.insumos.filter(i => invEstado(i) === "COMPRAR").sort((a, b) => String(a.proveedor).localeCompare(String(b.proveedor)) || byName(a, b));
    let t = `Lista de compras Saisei & Co (${new Date().toLocaleDateString("es-CL")})\n`, pv = null;
    l.forEach(i => { if(i.proveedor !== pv){ pv = i.proveedor; t += `\n${pv || "Sin proveedor"}:\n`; } t += `• ${i.nombre}: faltan ${qty(n0(i.minimo) - n0(i.stock))} ${i.unidad} (hay ${qty(i.stock)}, mínimo ${qty(i.minimo)})\n`; });
    try { await navigator.clipboard.writeText(t); toast("Lista copiada: pégala en WhatsApp o en notas"); }
    catch(e){ openModal("Lista de compras", `<textarea style="min-height:260px" readonly>${esc(t)}</textarea>`); }
  },
  csvVentas, csvGastos, backup,
  restore: () => $("restoreFile").click(),
  logout: async () => {
    if(mode === "nube" && outbox.length && !(await ask("Hay cambios que aún no se suben a la nube. Si cierras sesión ahora se perderán. ¿Cerrar igual?", "Cerrar sesión", true))) return;
    if(sb) await sb.auth.signOut();
    // La copia local solo se borra si todo está en la nube
    if(mode === "nube"){ localStorage.removeItem(LS_DATA); localStorage.removeItem(LS_OUT); }
    location.reload();
  },
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b || !A[b.dataset.act]) return;
  e.preventDefault();
  A[b.dataset.act](b.dataset, b, e);
});
// Campos que se guardan solos y búsquedas
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "vQ"){ UI.ventasQ = t.value; const pos = t.selectionStart; render(); const n = $("vQ"); n.focus(); n.setSelectionRange(pos, pos); }
  if(t.id === "iQ"){ UI.insQ = t.value; const pos = t.selectionStart; render(); const n = $("iQ"); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "invSolo"){ UI.invSolo = t.checked; render(); }
  if(t.dataset.inv){
    const i = insById(t.dataset.id); if(!i) return;
    i[t.dataset.inv] = nOrNull(t.value);
    if(t.dataset.inv === "stock") i.conteo = today();
    put("insumos", i); renderKeep(); toast("Inventario guardado");
  }
  if(t.dataset.fijo){ const f = S.fijos.find(x => x.id === t.dataset.fijo); if(f){ f.monto = n0(t.value); put("fijos", f); renderKeep(); toast("Guardado"); } }
  if(t.dataset.ap){
    const rec = apartados(curM).rec, d = rec.det[t.dataset.k] = rec.det[t.dataset.k] || {};
    if(t.dataset.ap === "pagado") d.pagado = t.checked;
    else if(t.dataset.ap === "monto") d.monto = nOrNull(t.value);
    else d.apartado = n0(t.value);
    put("apartados", rec); renderKeep(); toast("Guardado");
  }
  if(t.id === "restoreFile" && t.files[0]){ restore(t.files[0]); t.value = ""; }
});
document.addEventListener("submit", e => {
  if(e.target.id !== "parForm") return;
  e.preventDefault();
  const g = k => $("p_" + k).value;
  setPar({ ...S.par, flete:n0(g("flete")) / 100, foodCost:n0(g("foodCost")) / 100, comision:n0(g("comision")) / 100, iva:n0(g("iva")) / 100,
    dias:n0(g("dias")) || 1, ticket:n0(g("ticket")), meta:n0(g("meta")), deliveryCobro:n0(g("deliveryCobro")), deliveryCosto:n0(g("deliveryCosto")), diaCorte:Math.min(28, Math.max(1, Math.round(n0(g("diaCorte"))) || 1)), afectaIva:$("p_afectaIva").checked });
  curM = curMonth();
  render(); toast("Parámetros guardados");
});
// Si otra pestaña cambia los datos (modo local), se recargan
window.addEventListener("storage", e => { if(e.key === LS_DATA && mode === "local"){ S = normalize(readJSON(LS_DATA)); render(); } });

boot();
